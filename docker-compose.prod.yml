# ==============================================================================
# "Inglês em Ação" — stack de PRODUÇÃO (Portainer > Stacks > Repository)
#
# Nenhum segredo mora neste arquivo. Todo ${VARIAVEL} é preenchido pelas variáveis
# de ambiente cadastradas na stack do Portainer. Passo a passo: docs/DEPLOY.md.
#
# Este arquivo NÃO é o de desenvolvimento — para desenvolver, use docker-compose.yml.
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ingles-em-acao:latest
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: ${TZ:-America/Sao_Paulo}

      # O host é o nome do serviço (db) e a porta é a interna do Postgres (5432).
      # Senha com @ : / ? # quebra esta URL — use senha alfanumérica.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=10&pool_timeout=20

      # URL pública do app, sem barra no final, com https:// (o cookie de sessão é `secure`).
      APP_URL: ${APP_URL}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}

      # "true" só no primeiro deploy (popula módulos e as 42 aulas). Depois volte para "false".
      RUN_SEED: ${RUN_SEED:-false}

      # --- Biblioteca de mídia (imagens das aulas) ----------------------------
      # Decisão D6: imagem vai para VOLUME DOCKER, não para bucket. São ~150
      # arquivos, 30–80 MB, e um volume nomeado sobrevive a `down && up`, a troca
      # de imagem e a redeploy. Vídeo NUNCA entra aqui (banda da VPS): vai para
      # o bucket abaixo, ou fica como link externo (YouTube/Vimeo).
      # MEDIA_ROOT tem que ser o ponto de montagem de iea_uploads logo abaixo.
      MEDIA_STORAGE: ${MEDIA_STORAGE:-volume}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/var/uploads}

      # --- Vídeos enviados pelo painel (bucket S3-compatível, ex.: Cloudflare R2)
      # Opcionais: vazias, o painel aceita só link de vídeo e diz o que falta.
      # O arquivo vai do navegador direto ao bucket (URL assinada) — não passa
      # por este container. CORS do bucket: docs/DEPLOY.md, Passo 3.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}

    volumes:
      # ⚠️ Este volume entra no backup NO MESMO DIA em que a primeira imagem subir.
      # Volume sem backup é disco com aparência de segurança: o pg_dump traz os
      # registros de volta, e a tela fica cheia de quadrado cinza. Em Portainer, é
      # um container efêmero montando iea_uploads e escrevendo um .tar.gz junto do
      # dump do Postgres.
      - iea_uploads:/app/var/uploads

    ports:
      # Por padrão o app só escuta no próprio servidor (127.0.0.1): quem publica na
      # internet é o proxy reverso. Se o seu proxy roda em container (Nginx Proxy
      # Manager, Traefik), veja a seção de proxy em docs/DEPLOY.md.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

    healthcheck:
      # Sem curl/wget na imagem: o próprio Node faz a requisição.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      # Tempo de folga para a espera do banco + migrations no start.
      start_period: 90s

    networks:
      - iea

  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Sao_Paulo}

    # De propósito SEM `ports:` — o Postgres não fica exposto para fora do servidor.
    # Para acessá-lo de fora, use um túnel SSH (docs/DEPLOY.md).

    volumes:
      - iea_pgdata:/var/lib/postgresql/data

    healthcheck:
      # $$ escapa a interpolação do compose: quem expande é o shell de dentro do container.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - iea

volumes:
  iea_pgdata:
    name: iea_pgdata

  # Imagens enviadas pelo painel (/admin/midia). Servidas em /midia/<caminho>.
  iea_uploads:
    name: iea_uploads

networks:
  iea:
    name: iea
